# Builds installers from the selected ref and replaces the pre-release named by `tag`
name: Publish Prerelease

on:
  workflow_call:
    inputs:
      tag:
        description: 'The name used to tag the prerelease build'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'The name used to tag the prerelease build'
        type: string
        required: true

concurrency:
  group: prerelease-${{ inputs.tag }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.version.outputs.base }}
      suffix: ${{ steps.version.outputs.suffix }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Compute Version
        id: version
        run: |
          current=$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          echo "base=${current%-SNAPSHOT}" >> $GITHUB_OUTPUT
          echo "suffix=${RELEASE_TAG}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_installers:
    name: Build Installers
    needs: version
    uses: ./.github/workflows/build-installers.yml
    with:
      version-suffix: ${{ needs.version.outputs.suffix }}
    secrets: inherit

  create_release:
    needs: [version, build_installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.base }}-${{ inputs.tag }}
      RELEASE_TITLE: ${{ needs.version.outputs.base }} ${{ inputs.tag }} prerelease
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for git-cliff
      - name: Download Artifacts
        uses: actions/download-artifact@v4
      - name: Find Latest Release
        id: latest-release
        run: echo "tag=$(gh release view --json tagName --jq .tagName)" >> $GITHUB_OUTPUT
      - name: Generate Prerelease Log
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: ${{ steps.latest-release.outputs.tag }}..HEAD --strip header --ignore-tags '^(dev|${{ env.RELEASE_TAG }})$'
      - name: Rename Artifacts
        run: |
          mv Paintera-windows-latest-*/*.msi Paintera-${VERSION}-Windows.msi
          mv Paintera-ubuntu-22.04-*/*.deb Paintera-${VERSION}-ubuntu-22.04_x86_64.deb
          mv Paintera-ubuntu-24.04-*/*.deb Paintera-${VERSION}-ubuntu-24.04_x86_64.deb
          mv Paintera-ubuntu-26.04-*/*.deb Paintera-${VERSION}-ubuntu-26.04_x86_64.deb
          mv Paintera-macos-15-intel-*/*.dmg Paintera-${VERSION}-MacOS-15-Intel.dmg
          mv Paintera-macos-15-*/*.dmg Paintera-${VERSION}-MacOS-15-AppleSilicon.dmg
          mv Paintera-macos-26-*/*.dmg Paintera-${VERSION}-MacOS-26-AppleSilicon.dmg
      - name: Replace Release
        env:
          NOTES: ${{ steps.git-cliff.outputs.content }}
        run: |
          notes="${NOTES/\#\# \[unreleased\]/## ${RELEASE_TITLE}}"
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$notes" \
            Paintera-${VERSION}-*
